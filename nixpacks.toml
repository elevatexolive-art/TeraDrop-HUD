# Fallback if a service is still on Nixpacks. railway.json prefers Docker.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "ffmpeg"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r bot/requirements.txt"]

[start]
cmd = "sh bot/start.sh"
